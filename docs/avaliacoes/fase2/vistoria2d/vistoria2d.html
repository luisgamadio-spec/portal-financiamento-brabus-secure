    return svg(c.L, H, out, 10);
  }
  function arco(cx, cy, r) { return 'M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy; }
  function tampaNome() { return tipo === 'SEDAN' ? 'Tampa do porta-malas' : tipo === 'PICKUP' ? 'Tampa da caçamba' : 'Tampa traseira'; }
  function svg(w, h, conteudo, m) { return '<svg viewBox="' + (-m) + ' ' + (-m) + ' ' + (w + 2 * m) + ' ' + (h + 2 * m) + '" xmlns="http://www.w3.org/2000/svg">' + conteudo + '</svg>'; }

  function cima(c) {   // frente à direita; lado direito do carro embaixo
    var L = c.L, W = c.W, t = c.cima, out = '', H = W;
    var corpo = arredonda([[2, 12, 34], [L - 2, 8, 26], [L - 2, W - 8, 26], [2, W - 12, 34]]);
    out += '<path class="base" d="' + d(corpo, H) + '"/>';
    out += parte('Para-choque dianteiro', 'para-choque', caixa(corpo, -1, 14, -1, W + 1), H);
    out += parte('Para-choque traseiro', 'para-choque', caixa(corpo, L - 14, L + 1, -1, W + 1), H);
    out += parte('Capô', 'lataria', caixa(corpo, 14, t.capo, 18, W - 18), H);
    out += parte('Para-lama dianteiro esquerdo', 'lataria', caixa(corpo, 14, t.capo, -1, 18), H);
    out += parte('Para-lama dianteiro direito', 'lataria', caixa(corpo, 14, t.capo, W - 18, W + 1), H);
    out += parte('Para-brisa', 'vidro', arredonda([[t.capo + 4, 22, 4], [t.teto0, 30, 6], [t.teto0, W - 30, 6], [t.capo + 4, W - 22, 4]]), H);
    out += parte('Teto', 'lataria', arredonda([[t.teto0 + 2, 26, 10], [t.teto1 - 2, 26, 10], [t.teto1 - 2, W - 26, 10], [t.teto0 + 2, W - 26, 10]]), H);
    if (c.cacamba) {
      out += parte('Vidro traseiro', 'vidro', [[t.teto1 + 2, 34], [t.vigia1 - 4, 30], [t.vigia1 - 4, W - 30], [t.teto1 + 2, W - 34]], H);
      out += parte('Caçamba (assoalho)', 'lataria', caixa(corpo, t.vigia1 + 4, L - 26, 14, W - 14), H);
      out += parte('Caçamba lateral esquerda', 'lataria', caixa(corpo, t.vigia1 + 4, L - 14, -1, 14), H);
      out += parte('Caçamba lateral direita', 'lataria', caixa(corpo, t.vigia1 + 4, L - 14, W - 14, W + 1), H);
      out += parte('Tampa da caçamba', 'lataria', caixa(corpo, L - 26, L - 14, 14, W - 14), H);
    } else {
      out += parte('Vidro traseiro', 'vidro', arredonda([[t.teto1, 30, 6], [t.vigia1, 24, 4], [t.vigia1, W - 24, 4], [t.teto1, W - 30, 6]]), H);
      out += parte(tampaNome(), 'lataria', caixa(corpo, t.vigia1 + 2, L - 14, 16, W - 16), H);
      out += parte('Lateral traseira esquerda', 'lataria', caixa(corpo, c.cortes.portaT, L - 14, -1, 16), H);
      out += parte('Lateral traseira direita', 'lataria', caixa(corpo, c.cortes.portaT, L - 14, W - 16, W + 1), H);
    }
    out += parte('Porta dianteira esquerda', 'lataria', caixa(corpo, t.capo, c.cortes.portaD, -1, 14), H);
    out += parte('Porta dianteira direita', 'lataria', caixa(corpo, t.capo, c.cortes.portaD, W - 14, W + 1), H);
    out += parte('Porta traseira esquerda', 'lataria', caixa(corpo, c.cortes.portaD, c.cortes.portaT, -1, 14), H);
    out += parte('Porta traseira direita', 'lataria', caixa(corpo, c.cortes.portaD, c.cortes.portaT, W - 14, W + 1), H);
    out += parte('Retrovisor esquerdo', 'retrovisor', arredonda([[t.capo + 8, 12, 3], [t.capo + 24, 12, 3], [t.capo + 20, -6, 4], [t.capo + 6, -6, 4]]), H);
    out += parte('Retrovisor direito', 'retrovisor', arredonda([[t.capo + 8, W - 12, 3], [t.capo + 24, W - 12, 3], [t.capo + 20, W + 6, 4], [t.capo + 6, W + 6, 4]]), H);
    if (c.barras) { out += '<path class="det" d="M' + (t.teto0 + 10) + ' ' + (H - 30) + 'L' + (t.teto1 - 10) + ' ' + (H - 30) + 'M' + (t.teto0 + 10) + ' ' + (H - W + 30) + 'L' + (t.teto1 - 10) + ' ' + (H - W + 30) + '"/>'; }
    return svg(L, W, out, 16);
  }

  function frenteTras(c, qual) {   // frente: lado esquerdo do carro à DIREITA do desenho; traseira: à esquerda
    var W = c.W, f = c.frente, H = f.teto + 4, out = '', fr = qual === 'frente';
    var tr = c.tras, vao = c.vao, cint = f.cintura, ladoDir = function (x) { return fr ? (x > W / 2 ? 'esquerd' : 'direit') : (x < W / 2 ? 'esquerd' : 'direit'); };
    var baixo = arredonda([[4, vao, 8], [W - 4, vao, 8], [W, cint - 16, 12], [W - 8, cint, 10], [8, cint, 10], [0, cint - 16, 12]]);
    var topoCab = tr.cabine && !fr ? f.teto : f.teto;
    var cab = arredonda([[16, cint - 2, 4], [W - 16, cint - 2, 4], [W - f.vaoTeto, topoCab, 12], [f.vaoTeto, topoCab, 12]]);
    // pneus primeiro (ficam atrás da carroceria)
    [[6, 6 + f.pneu], [W - 6 - f.pneu, W - 6]].forEach(function (x) {
      out += parte('Pneu ' + (fr ? 'dianteiro ' : 'traseiro ') + ladoDir(x[0]) + 'o', 'pneu', arredonda([[x[0], 0, 4], [x[1], 0, 4], [x[1], vao + 30, 4], [x[0], vao + 30, 4]]), H);
    });
    out += '<path class="base" d="' + d(cab, H) + '"/><path class="base" d="' + d(baixo, H) + '"/>';
    if (fr) {
      out += parte('Para-choque dianteiro', 'para-choque', caixa(baixo, -1, W + 1, -1, f.pc), H);
      var g0 = f.grade[0], g1 = 1 - g0; out += parte('Grade', 'grade', arredonda([[W * g0, f.pc + 4, 5], [W * g1, f.pc + 4, 5], [W * (g1 - .02), cint - f.grade[1], 5], [W * (g0 + .02), cint - f.grade[1], 5]]), H);
      out += parte('Farol direito', 'farol', arredonda([[10, cint - 30, 4], [W * f.farolL, cint - 26, 4], [W * f.farolL, cint - 13, 4], [12, cint - 16, 4]]), H);
      out += parte('Farol esquerdo', 'farol', arredonda([[W - 10, cint - 30, 4], [W * (1 - f.farolL), cint - 26, 4], [W * (1 - f.farolL), cint - 13, 4], [W - 12, cint - 16, 4]]), H);
      out += parte('Capô', 'lataria', caixa(baixo, -1, W + 1, cint - 10, cint + 1), H);
      out += parte('Para-brisa', 'vidro', caixa(cab, 20, W - 20, cint + 3, f.teto - 10), H);
      out += parte('Teto', 'lataria', caixa(cab, -1, W + 1, f.teto - 8, 999), H);
    } else {
      out += parte('Para-choque traseiro', 'para-choque', caixa(baixo, -1, W + 1, -1, tr.pc), H);
      out += parte(tampaNome(), 'lataria', caixa(baixo, W * (tr.cabine ? .2 : .2), W * .8, tr.pc + 2, tr.tampaAte), H);
      out += parte('Lanterna traseira esquerda', 'lanterna', arredonda([[4, cint - 34, 4], [W * .19, cint - 30, 4], [W * .19, cint - 8, 4], [6, cint - 10, 4]]), H);
      out += parte('Lanterna traseira direita', 'lanterna', arredonda([[W - 4, cint - 34, 4], [W * .81, cint - 30, 4], [W * .81, cint - 8, 4], [W - 6, cint - 10, 4]]), H);
      out += parte('Vidro traseiro', 'vidro', caixa(cab, 22, W - 22, tr.vidroDe, f.teto - 10), H);
      out += parte('Teto', 'lataria', caixa(cab, -1, W + 1, f.teto - 8, 999), H);
      out += '<path class="det" d="M' + (W * .44) + ' ' + (H - tr.pc - 18) + 'L' + (W * .56) + ' ' + (H - tr.pc - 18) + '"/>';
    }
    // retrovisores
    [[-14, 2], [W - 2, W + 14]].forEach(function (x) {
      var dir = x[0] < 0 ? !fr : fr;   // à esquerda do desenho: na frente é o lado direito do carro
      out += parte('Retrovisor ' + (x[0] < 0 ? (fr ? 'direito' : 'esquerdo') : (fr ? 'esquerdo' : 'direito')), 'retrovisor', arredonda([[x[0], cint + 4, 3], [x[1], cint + 6, 3], [x[1], cint + 18, 3], [x[0], cint + 16, 3]]), H);
    });
    return svg(W, H, out, 18);
  }

  // ---------------------------------------------------------------- tela
  var VISTAS = [['TODAS', 'Todas'], ['LE', 'Lat. esq.'], ['LD', 'Lat. dir.'], ['CIMA', 'Cima'], ['FRENTE', 'Frente'], ['TRAS', 'Traseira']];
  function desenhar() {
    var c = C[tipo], html = '';
    var bloco = function (rot, s, larga) { return '<div class="vista' + (larga ? ' larga' : '') + '"><div class="rot">' + rot + '</div>' + s + '</div>'; };
    if (vista === 'TODAS') {
      html = bloco('Lateral esquerda', lateral(c, 'esquerdo'), true) + bloco('Lateral direita', lateral(c, 'direito'), true) +
        bloco('Frente', frenteTras(c, 'frente')) + bloco('Traseira', frenteTras(c, 'tras')) + bloco('Cima', cima(c), true);
    } else {
      var m = { LE: ['Lateral esquerda', lateral(c, 'esquerdo')], LD: ['Lateral direita', lateral(c, 'direito')], CIMA: ['Cima', cima(c)],
                FRENTE: ['Frente', frenteTras(c, 'frente')], TRAS: ['Traseira', frenteTras(c, 'tras')] }[vista];
      html = bloco(m[0], m[1], true);
    }
    document.getElementById('desenho').innerHTML = html;
    pintar();
  }
  function pintar() {
    var ordem = { Leve: 1, 'Média': 2, Grave: 3 };
    document.querySelectorAll('#desenho .peca').forEach(function (el) {
      var ch = el.getAttribute('data-chave');
      var pior = avarias.filter(function (a) { return a.tipoCarro === tipo && a.chave === ch; }).sort(function (a, b) { return ordem[b.g] - ordem[a.g]; })[0];
      el.classList.remove('toque', 'g1', 'g2', 'g3');
      if (pendente && pendente.chave === ch) el.classList.add('toque');
      else if (pior) el.classList.add('g' + ordem[pior.g]);
    });
  }
  document.getElementById('desenho').addEventListener('click', function (e) {
    var el = e.target.closest('.peca'); if (!el) return;
    abrir(el.getAttribute('data-chave'), el.getAttribute('data-grupo'));
  });
  function abrir(chave, grupo) {
    pendente = { chave: chave, grupo: grupo, tipoCarro: tipo }; sel = { t: null, g: 'Leve' };
    renderFolha(); pintar(); document.getElementById('folha').classList.add('aberta'); document.body.classList.add('folhaAberta');
  }
  function chips(id, lista, k) {
    var el = document.getElementById(id);
    el.innerHTML = lista.map(function (v) { return '<button type="button" class="' + (sel[k] === v ? 'on' : '') + '" data-v="' + v + '">' + v + '</button>'; }).join('');
    el.onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; sel[k] = b.getAttribute('data-v'); renderFolha(); };
  }
  function renderFolha() {
    var ja = avarias.filter(function (a) { return a.chave === pendente.chave && a.tipoCarro === tipo; }).length;
    document.getElementById('fPeca').textContent = pendente.chave;
    document.getElementById('fSub').textContent = GRUPO_NOME[pendente.grupo] + (ja ? ' · já tem ' + ja + ' avaria(s)' : '');
    chips('fTipo', TIPOS[pendente.grupo], 't'); chips('fGrav', GRAV, 'g');
    var s = document.getElementById('fSalvar'); s.disabled = !sel.t; s.style.opacity = sel.t ? 1 : .45;
  }
  function fechar() { pendente = null; document.getElementById('folha').classList.remove('aberta'); document.body.classList.remove('folhaAberta'); pintar(); }
  document.getElementById('fCancelar').onclick = fechar;
  document.getElementById('fSalvar').onclick = function () { if (!sel.t) return; avarias.push({ chave: pendente.chave, grupo: pendente.grupo, tipoCarro: tipo, t: sel.t, g: sel.g }); fechar(); lista(); };
  document.getElementById('btnEstepe').onclick = function () { abrir('Pneu estepe', 'pneu'); };
  document.getElementById('btnChecklist').onclick = function () { document.getElementById('tituloChecklist').scrollIntoView({ behavior: 'smooth' }); };
  function lista() {
    var cor = { Leve: 'var(--leve)', 'Média': 'var(--media)', Grave: 'var(--grave)' };
    document.getElementById('avarias').innerHTML = avarias.map(function (a) { return '<div class="av" style="border-left-color:' + cor[a.g] + '"><div>' + a.chave + ' · ' + a.t + '<small>' + a.g + ' · 1 foto</small></div><b>a definir</b></div>'; }).join('') || '<div class="av"><div>Nenhuma avaria marcada</div></div>';
    document.getElementById('total').textContent = avarias.length ? avarias.length + ' avaria(s) · reparos: a definir' : '';
  }
  var CHECK = [['Interior (bancos, forros, carpete)', ['Bom', 'Regular', 'Ruim']], ['Luzes de alerta no painel', ['Nenhuma', 'Acesa(s)']], ['Ar-condicionado', ['Gela', 'Fraco', 'Não funciona']],
               ['Chave reserva', ['Tem', 'Não tem']], ['Manual do proprietário', ['Tem', 'Não tem']], ['Revisões', ['Em dia na concessionária', 'Parciais', 'Sem comprovação']]];
  var resp = {};
  function checklist() {
    document.getElementById('checklist').innerHTML = CHECK.map(function (c, i) { return '<div class="chk"><p>' + c[0] + '</p><div class="chips" data-i="' + i + '">' + c[1].map(function (o) { return '<button type="button" class="' + (resp[i] === o ? 'on' : '') + '">' + o + '</button>'; }).join('') + '</div></div>'; }).join('');
    document.querySelectorAll('#checklist .chips').forEach(function (el) { el.onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; resp[el.getAttribute('data-i')] = b.textContent; checklist(); }; });
  }
  document.getElementById('carrs').innerHTML = Object.keys(C).map(function (k) { return '<button type="button" data-k="' + k + '" class="' + (k === tipo ? 'on' : '') + '">' + C[k].nome + '</button>'; }).join('');
  document.getElementById('carrs').onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; tipo = b.getAttribute('data-k'); fechar();
    document.querySelectorAll('#carrs button').forEach(function (x) { x.classList.toggle('on', x === b); }); desenhar(); };
  document.getElementById('vistas').innerHTML = VISTAS.map(function (v, i) { return '<button type="button" data-v="' + v[0] + '" class="' + (i === 0 ? 'on' : '') + '">' + v[1] + '</button>'; }).join('');
  document.getElementById('vistas').onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; vista = b.getAttribute('data-v');
    document.querySelectorAll('#vistas button').forEach(function (x) { x.classList.toggle('on', x === b); }); desenhar(); };
  desenhar(); lista(); checklist();
  window.__v2d = { avarias: function () { return avarias; }, pecas: function () { return Array.prototype.map.call(document.querySelectorAll('#desenho .peca'), function (e) { return e.getAttribute('data-chave'); }); } };
})();
</script>
