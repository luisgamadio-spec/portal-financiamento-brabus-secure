<!doctype html>
<html lang="pt-BR">

<title>Protótipo — Vistoria 3D (v3)</title>
<style>

          --leve:#f5c518; --media:#ff8c1a; --grave:#e3262f; --toque:#39b6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.folhaAberta { padding-bottom: 62vh; }
  .topo { padding:14px 16px 6px; }

  .topo p { margin:4px 0 0; color:var(--mut); font-size:13px; }

  button { font-family:inherit; }
  .carrs button, .vistas button, .chips button, .extra button { min-height:42px; border-radius:8px; border:1px solid var(--line); background:#1b1b1f; color:var(--mut); font-size:13px; }

  .legenda i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .vistas { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:6px 16px; }
  .vistas button { min-height:44px; font-size:12px; }
  .extra { display:flex; gap:6px; padding:0 16px 6px; }
  .extra button { flex:1; }

  .chips button { padding:0 12px; }
  .folha { position:fixed; left:0; right:0; bottom:0; max-height:min(78vh, 560px); overflow-y:auto; overscroll-behavior:contain;
           background:#151518; border-top:1px solid var(--line); border-radius:16px 16px 0 0;
           padding:14px 16px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .22s; box-shadow:0 -12px 40px rgba(0,0,0,.55); }

// ---------------------------------------------------------------- curvas e seções
function curva(pts) {   // interpolação cúbica monótona (Fritsch–Carlson): curva suave que não "estoura" entre os pontos

  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));

  for (let i = 0; i < n - 1; i++) {

const clamp01 = v => Math.max(0, Math.min(1, v));
function alturaTeto(c, x) {   // linha de cima da cabine (na caçamba: o assoalho)

// ---------------------------------------------------------------- a que peça pertence cada pedaço da superfície
const nomeL = (base, lado, fem) => base + ' ' + (lado === 'd' ? (fem ? 'direita' : 'direito') : (fem ? 'esquerda' : 'esquerdo'));

}

let tipo = 'SUV', avarias = [], pendente = null, sel = { t: null, g: 'Leve' };
const palco = document.getElementById('palco');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const cena = new THREE.Scene();
// reflexo de estúdio: degradê liso (chão escuro → faixa de luz no horizonte → teto suave), sem objetos que virem listras na lataria
function estudio() {   // panorama gerado (só depende da altura), sem emendas
  const W = 256, H = 128, d = new Float32Array(W * H * 4), ss = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  for (let j = 0; j < H; j++) {
    const h = Math.sin(Math.PI * ((j + .5) / H - .5));   // linha 0 = embaixo (h = -1), última = em cima (h = 1)
    let c = .04 + (.2 - .04) * ss(-.35, .05, h); c += .45 * Math.exp(-(((h - .18) / .1) ** 2)); c = c + (.42 - c) * ss(.35, .95, h);

cena.environment = estudio();
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
// luz equilibrada: capô e teto não clareiam mais que a lateral (carro em cor única)
cena.add(new THREE.HemisphereLight(0xffffff, 0x5a5d66, .55));
const sol = new THREE.DirectionalLight(0xffffff, .9); sol.position.set(5, 5, 7); cena.add(sol);
const contra = new THREE.DirectionalLight(0xc9d3ff, .7); contra.position.set(-6, 3, -6); cena.add(contra);
const carro = new THREE.Group(); cena.add(carro);
const ALVO = new THREE.Vector3(0, .85, 0);
let teta = -0.75, fi = 1.15, alvoTeta = teta, alvoFi = fi, raio = 10, sujo = true;
const linhaMat = new LineMaterial({ color: COR_LINHA, linewidth: .9 });
let partes = [], bloqueios = [];

function material(grupo) {

    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
}
function parte(geo, nome, grupo, chave) {
  const m = new THREE.Mesh(geo, material(grupo));
  m.userData = { nome, grupo: grupo === 'lanterna' ? 'farol' : grupo, chave: chave || nome, corBase: COR[grupo] };
  carro.add(m); partes.push(m); return m;
}
function bloqueio(geo, grupo) { const m = new THREE.Mesh(geo, material(grupo)); carro.add(m); bloqueios.push(m); return m; }

function carroceria(c) {
  const xs = estacoes(c), NR = 34, S = xs.length;
  const linha = r => r <= 17 ? r : 34 - r;
  const pos = new Float32Array(S * NR * 3);
  xs.forEach((x, i) => {
    const s = secao(c, x);
    for (let r = 0; r < NR; r++) { const [z0, y] = s[linha(r)]; const z = (r <= 17 ? 1 : -1) * z0 * planta(c, x, y); pos.set([x, y, z], (i * NR + r) * 3); }
  });
  const P = (i, r) => new THREE.Vector3(pos[(i * NR + r) * 3], pos[(i * NR + r) * 3 + 1], pos[(i * NR + r) * 3 + 2]);
  const gs = xs.map(x => alturaTeto(c, x) - c.belt(x));
  // células (entre duas seções e duas linhas): classifica cada uma
  const chave = [], idx = [], porChave = new Map();
  for (let i = 0; i < S - 1; i++) {
    chave.push([]);
    for (let r = 0; r < NR; r++) {
      const r1 = (r + 1) % NR, a = P(i, r), b = P(i + 1, r), cc = P(i + 1, r1), d = P(i, r1);
      const nrm = new THREE.Vector3().subVectors(cc, a).cross(new THREE.Vector3().subVectors(d, b));
      if (nrm.length() < 1e-7) { chave[i].push(null); continue; }
      nrm.normalize();
      const cen = a.clone().add(b).add(cc).add(d).multiplyScalar(.25);
      const cl = classe(c, (xs[i] + xs[i + 1]) / 2, cen.y, cen.z, nrm, Math.min(linha(r), linha(r1)), r <= 16 ? 'd' : 'e', (gs[i] + gs[i + 1]) / 2);
      const k = cl.corpo || cl.nome;
      chave[i].push(k);
      if (!porChave.has(k)) porChave.set(k, { cl, tri: [] });
      // diagonal espelhada entre os lados (o lado direito é o reflexo do esquerdo; sem sombra diferente onde a superfície fecha)
      const ia = i * NR + r, ib = (i + 1) * NR + r, ic = (i + 1) * NR + r1, id = i * NR + r1;
      const t = r <= 16 ? [ia, ib, id, ib, ic, id] : [ia, ib, ic, ia, ic, id];

  const nor = geo.attributes.normal.array;

    for (let i = 0; i < S; i++) for (let r = 1; r < 17; r++) {

        let sx = 0, sy = 0, sz = 0;
        for (const q of viz) { sx += nor[q * 3]; sy += nor[q * 3 + 1]; sz += nor[q * 3 + 2]; }

    const p = new Float32Array(tri.length * 3), n = new Float32Array(tri.length * 3);
    tri.forEach((v, j) => { for (let e = 0; e < 3; e++) { p[j * 3 + e] = pos[v * 3 + e]; n[j * 3 + e] = nor[v * 3 + e]; } });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('normal', new THREE.BufferAttribute(n, 3));

  const traça = (v1, v2) => { const a = ponto(v1), b = ponto(v2); if (Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) > 1e-4) seg.push(...a, ...b); };

    const k1 = chave[i][r1]; if (k1 && k1 !== k && !(k === 'baixo' && k1 === 'baixo')) traça(i * NR + r1, (i + 1) * NR + r1);
    if (i + 1 < S - 1) { const k2 = chave[i + 1][r]; if (k2 && k2 !== k) traça((i + 1) * NR + r, (i + 1) * NR + r1); }

  const pai = [], chaveP = (k) => seg.slice(k, k + 3).map(v => Math.round(v * 2000)).join(','), id = new Map();

  const raiz = a => { while (pai[a] !== a) a = pai[a] = pai[pai[a]]; return a; };

function rodas(c) {
  const R = c.R, hw = .11, ri = R * .66;
  const perfil = [[ri, -hw], [R - .05, -hw], [R - .015, -hw + .02], [R, -hw + .055], [R, hw - .055], [R - .015, hw - .02], [R - .05, hw], [ri, hw]].map(([a, b]) => new THREE.Vector2(a, b));
  // aro: disco com 5 raios
  const aro = new THREE.Shape(); aro.absarc(0, 0, ri, 0, Math.PI * 2, false);
  for (let k = 0; k < 5; k++) {
    const a0 = Math.PI / 2 + k * 2 * Math.PI / 5 + .2, a1 = a0 + 2 * Math.PI / 5 - .4, h = new THREE.Path();
    h.absarc(0, 0, ri * .84, a0, a1, false); h.absarc(0, 0, ri * .34, a1, a0, true); aro.holes.push(h);
  }
  c.eixos.forEach((x, i) => {
    for (const s of [1, -1]) {
      const pos = i ? 'dianteir' : 'traseir', lado = s > 0 ? 'direit' : 'esquerd', zc = s * (c.W2 - .135);
      const gp = new THREE.LatheGeometry(perfil, 48); gp.rotateX(Math.PI / 2); gp.translate(x, R, zc);
      parte(gp, 'Pneu ' + pos + 'o ' + lado + 'o', 'pneu');
      const face = new THREE.ExtrudeGeometry(aro, { depth: .03, bevelEnabled: true, bevelThickness: .008, bevelSize: .008, bevelSegments: 2, curveSegments: 40 });
      face.translate(0, 0, hw - .05);
      const tambor = new THREE.CylinderGeometry(ri, ri, .2, 40, 1, true); tambor.rotateX(Math.PI / 2); tambor.translate(0, 0, -.01);
      const cubo = new THREE.CylinderGeometry(.06, .06, .05, 20); cubo.rotateX(Math.PI / 2); cubo.translate(0, 0, hw - .03);
      const gr = mergeGeometries([face.toNonIndexed(), tambor.toNonIndexed(), cubo.toNonIndexed()].map(g => { g.deleteAttribute('uv'); return g; }));
      if (s < 0) gr.rotateY(Math.PI);
      gr.translate(x, R, zc);
      const m = parte(gr, 'Roda ' + pos + 'a ' + lado + 'a', 'roda'); m.material.side = THREE.DoubleSide;
    }
  });
}

function extras(c) {
  const xCapo = c.roofX[1];
  for (const s of [1, -1]) {   // retrovisores
    const casca = new THREE.SphereGeometry(1, 24, 16); casca.scale(.1, .075, .12);
    const haste = new THREE.BoxGeometry(.06, .03, .1); haste.translate(0, -.02, -s * .1);
    const g = mergeGeometries([casca.toNonIndexed(), haste.toNonIndexed()].map(q => { q.deleteAttribute('uv'); return q; }));
    g.translate(xCapo - .14, c.belt(xCapo) + .1, s * (c.W2 - .14 + .17));
    parte(g, 'Retrovisor ' + (s > 0 ? 'direito' : 'esquerdo'), 'retrovisor');
  }

    const z = s * (c.W2 - c.tumble - .03), pts = [];
    for (let x = -1.7; x <= .4; x += .15) pts.push(new THREE.Vector3(x, c.roof(x) + c.coroa * (1 - (z / c.W2) ** 2) + .05, z));

    const prof = .025, z0 = s > 0 ? c.W2 + .004 : -(c.W2 + .004) - prof;
    for (const e of c.eixos) {
      const ri = c.Ra, re = c.Ra + .075, a0 = Math.asin(Math.min(1, (c.base(e) - .05 - c.R) / re)), f = new THREE.Shape();
      f.absarc(0, 0, re, Math.max(0, a0), Math.PI - Math.max(0, a0), false); f.absarc(0, 0, ri, Math.PI - Math.max(0, a0), Math.max(0, a0), true);
      const g = new THREE.ExtrudeGeometry(f, { depth: prof, bevelEnabled: true, bevelThickness: .006, bevelSize: .006, bevelSegments: 2, curveSegments: 48 });
      g.translate(e, c.R, z0); bloqueio(g, 'moldura');

function montar() {
  carro.clear(); partes = []; bloqueios = [];
  const c = C[tipo];
  carroceria(c); rodas(c); extras(c);
  ALVO.y = c.tetoMax * .52;
  pintar();
  raio = c.L * 2.25 / Math.min(1, cam.aspect || 1); sujo = true;
}

// cor de cada peça: em toque (azul) > pior gravidade marcada > cor normal
function pintar() {
  const ordem = { Leve: 1, 'Média': 2, Grave: 3 };
  for (const m of partes) {
    const marc = avarias.filter(a => a.tipoCarro === tipo && a.chave === m.userData.chave);
    const pior = marc.sort((a, b) => ordem[b.g] - ordem[a.g])[0];
    const toque = pendente && pendente.chave === m.userData.chave;
    m.material.color.setHex(toque ? TOQUE : pior ? COR_GRAV[pior.g] : m.userData.corBase);
    m.material.emissive.setHex(toque ? 0x0b3b55 : pior ? 0x1a0d00 : 0x000000);
  }
  sujo = true;
}

// ---------------------------------------------------------------- girar e tocar
let arrastando = false, moveu = 0, ux = 0, uy = 0;
renderer.domElement.addEventListener('pointerdown', e => { arrastando = true; moveu = 0; ux = e.clientX; uy = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => {
  if (!arrastando) return;
  const dx = e.clientX - ux, dy = e.clientY - uy; moveu += Math.abs(dx) + Math.abs(dy); ux = e.clientX; uy = e.clientY;
  alvoTeta -= dx * .01; alvoFi = Math.max(.06, Math.min(1.5, alvoFi - dy * .006));
});
renderer.domElement.addEventListener('pointerup', e => { arrastando = false; if (moveu < 8) tocar(e); });
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function tocar(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, cam);
  const hit = ray.intersectObjects([...partes, ...bloqueios], false)[0];
  if (!hit || !hit.object.userData.chave) return;
  abrirFolha(hit.object.userData);
}
function abrirFolha(ud) {

  sel = { t: null, g: 'Leve' };
  renderFolha(); pintar();
  document.getElementById('folha').classList.add('aberta'); document.body.classList.add('folhaAberta');
}
function chips(id, lista, chave) {

  el.innerHTML = lista.map(v => `<button type="button" class="${sel[chave] === v ? 'on' : ''}" data-v="${v}">${v}</button>`).join('');
  el.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; sel[chave] = b.dataset.v; renderFolha(); };
}
function renderFolha() {
  document.getElementById('fPeca').textContent = pendente.nome;
  const ja = avarias.filter(a => a.chave === pendente.chave && a.tipoCarro === tipo).length;
  document.getElementById('fSub').textContent = { lataria: 'Lataria', 'para-choque': 'Para-choque', vidro: 'Vidro', farol: 'Farol/lanterna', grade: 'Grade', roda: 'Roda', pneu: 'Pneu', retrovisor: 'Retrovisor', estrutura: 'Estrutura' }[pendente.grupo] + (ja ? ` · já tem ${ja} avaria(s) marcada(s)` : '');
  chips('fTipo', TIPOS[pendente.grupo], 't'); chips('fGrav', GRAV, 'g');
  document.getElementById('fSalvar').disabled = !sel.t; document.getElementById('fSalvar').style.opacity = sel.t ? 1 : .45;
}
function fecharFolha() { pendente = null; document.getElementById('folha').classList.remove('aberta'); document.body.classList.remove('folhaAberta'); pintar(); }
document.getElementById('fCancelar').onclick = fecharFolha;
document.getElementById('fSalvar').onclick = () => { if (!sel.t) return; avarias.push({ ...pendente, t: sel.t, g: sel.g }); fecharFolha(); lista(); };
document.getElementById('btnEstepe').onclick = () => abrirFolha({ chave: 'Pneu estepe', nome: 'Pneu estepe', grupo: 'pneu' });
document.getElementById('btnChecklist').onclick = () => document.getElementById('tituloChecklist').scrollIntoView({ behavior: 'smooth' });
function lista() {
  const cor = { Leve: 'var(--leve)', 'Média': 'var(--media)', Grave: 'var(--grave)' };
  document.getElementById('avarias').innerHTML = avarias.map(a => `<div class="av" style="border-left-color:${cor[a.g]}"><div>${a.nome} · ${a.t}<small>${a.g} · 1 foto</small></div><b>a definir</b></div>`).join('')
    || '<div class="av"><div>Nenhuma avaria marcada</div></div>';
  document.getElementById('total').textContent = avarias.length ? avarias.length + ' avaria(s) · reparos: a definir' : '';
}

// ---------------------------------------------------------------- checklist depois da lataria
const CHECK = [['Interior (bancos, forros, carpete)', ['Bom', 'Regular', 'Ruim']], ['Luzes de alerta no painel', ['Nenhuma', 'Acesa(s)']],
  ['Ar-condicionado', ['Gela', 'Fraco', 'Não funciona']], ['Chave reserva', ['Tem', 'Não tem']], ['Manual do proprietário', ['Tem', 'Não tem']],
  ['Revisões', ['Em dia na concessionária', 'Parciais', 'Sem comprovação']]];
const resp = {};
function checklist() {
  document.getElementById('checklist').innerHTML = CHECK.map(([p, ops], i) => `<div class="chk"><p>${p}</p><div class="chips" data-i="${i}">${ops.map(o => `<button type="button" class="${resp[i] === o ? 'on' : ''}">${o}</button>`).join('')}</div></div>`).join('');
  document.querySelectorAll('#checklist .chips').forEach(el => el.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; resp[el.dataset.i] = b.textContent; checklist(); });
}

// ---------------------------------------------------------------- vistas e carrocerias
const VISTAS = [['3D', -0.75, 1.15], ['Frente', 0, 1.38], ['Traseira', Math.PI, 1.38], ['Lat. esq.', -Math.PI / 2, 1.47], ['Lat. dir.', Math.PI / 2, 1.47], ['Teto', -Math.PI / 2, .06]];
document.getElementById('vistas').innerHTML = VISTAS.map((v, i) => `<button type="button" data-i="${i}" class="${i === 0 ? 'on' : ''}">${v[0]}</button>`).join('');
document.getElementById('vistas').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return; const v = VISTAS[+b.dataset.i]; alvoTeta = v[1]; alvoFi = v[2];
  document.querySelectorAll('#vistas button').forEach(x => x.classList.toggle('on', x === b));
};
document.getElementById('carrs').innerHTML = Object.keys(C).map(k => `<button type="button" data-k="${k}" class="${k === tipo ? 'on' : ''}">${C[k].nome}</button>`).join('');
document.getElementById('carrs').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return; tipo = b.dataset.k; fecharFolha(); montar();
  document.querySelectorAll('#carrs button').forEach(x => x.classList.toggle('on', x === b));
};
function tamanho() {
  const w = palco.clientWidth, h = palco.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  linhaMat.resolution.set(w, h); raio = C[tipo].L * 2.25 / Math.min(1, cam.aspect); sujo = true;
}
addEventListener('resize', tamanho); tamanho(); montar(); lista(); checklist();
// desenha só quando algo muda (economiza bateria no celular)
(function loop() {
  let d = alvoTeta - teta; d = Math.atan2(Math.sin(d), Math.cos(d));
  if (Math.abs(d) > 1e-4 || Math.abs(alvoFi - fi) > 1e-4 || sujo) {
    teta += d * .15; fi += (alvoFi - fi) * .15; sujo = false;
    cam.position.set(ALVO.x + raio * Math.sin(fi) * Math.cos(teta), ALVO.y + raio * Math.cos(fi), ALVO.z + raio * Math.sin(fi) * Math.sin(teta));
    if (fi < .2) cam.up.set(-Math.cos(teta), 0, -Math.sin(teta)); else cam.up.set(0, 1, 0);
    cam.lookAt(ALVO); renderer.render(cena, cam);
  }
  requestAnimationFrame(loop);
})();
window.__proto = { abrir: ud => abrirFolha(ud), avarias: () => avarias, partes: () => partes.map(p => p.userData.nome), pendente: () => pendente,
  // só para os testes: ponto da tela sobre a peça, num pedaço virado para a câmera
  onde: nome => {
    const m = partes.find(p => p.userData.nome === nome); if (!m) return null;
    const pa = m.geometry.attributes.position, na = m.geometry.attributes.normal, cs = [], soma = new THREE.Vector3();
    for (let i = 0; i < pa.count; i += 3) {
      const c = new THREE.Vector3(), n = new THREE.Vector3();
      for (let j = 0; j < 3; j++) { c.add(new THREE.Vector3().fromBufferAttribute(pa, i + j)); n.add(new THREE.Vector3().fromBufferAttribute(na, i + j)); }
      c.divideScalar(3).applyMatrix4(m.matrixWorld);
      if (n.normalize().dot(cam.position.clone().sub(c).normalize()) > .4) { cs.push(c); soma.add(c); }
    }
    if (!cs.length) return null; soma.divideScalar(cs.length);
    const alvo = cs.reduce((a, b) => a.distanceTo(soma) < b.distanceTo(soma) ? a : b).clone().project(cam);
    const r = renderer.domElement.getBoundingClientRect(); return { x: r.left + (alvo.x + 1) / 2 * r.width, y: r.top + (1 - alvo.y) / 2 * r.height };
  },
  qual: (sx, sy) => { const r = renderer.domElement.getBoundingClientRect(); ptr.set(((sx - r.left) / r.width) * 2 - 1, -((sy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, cam); return ray.intersectObjects(carro.children, false).slice(0, 3).map(h => [h.object.type, h.object.userData.nome || h.object.material?.color?.getHexString(), h.point.toArray().map(v => +v.toFixed(3)), h.face && h.face.normal.toArray().map(v => +v.toFixed(2))]); },
  malha: nome => { const m = partes.find(p => p.userData.nome === nome); return { position: [...m.geometry.attributes.position.array], normal: [...m.geometry.attributes.normal.array] }; },
  normalMedia: nome => { const m = partes.find(p => p.userData.nome === nome); const na = m.geometry.attributes.normal, s = new THREE.Vector3();
    for (let i = 0; i < na.count; i++) s.add(new THREE.Vector3().fromBufferAttribute(na, i)); return s.normalize().toArray(); } };
</script>
