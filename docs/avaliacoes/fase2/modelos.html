<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparação — modelos prontos (Kenney Car Kit, CC0)</title>
<style>body{margin:0;background:#0b0b0c;color:#f2f2f3;font-family:system-ui,sans-serif}h1{font-size:17px;font-weight:400;margin:12px 16px 4px}p{margin:0 16px 8px;color:#a3a3ad;font-size:12px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px}.c{background:radial-gradient(ellipse at 50% 60%,#2a2c31 0%,#141518 70%);border-radius:10px;height:200px;position:relative}
.c span{position:absolute;left:8px;top:6px;font-size:12px;color:#a3a3ad}canvas{width:100%;height:100%;display:block}</style></head>
<body><h1>Modelos prontos gratuitos (Kenney Car Kit, licença CC0)</h1><p>Corpo do carro em uma peça só + 4 rodas. Não dá para acender porta, capô ou para-lama sem recortar o modelo à mão.</p>
<div class="grade" id="g"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const M = [['hatchback-sports','Hatch (hatchback-sports)'],['sedan','Sedan'],['suv','SUV'],['truck','Pickup? (truck)']];
const loader = new GLTFLoader(); window.__prontos = 0;
for (const [arq, nome] of M) {
  const d = document.createElement('div'); d.className = 'c'; d.innerHTML = `<span>${nome}</span>`; document.getElementById('g').appendChild(d);
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true }); r.setPixelRatio(2); d.appendChild(r.domElement);
  const cena = new THREE.Scene(); cena.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.4)); const l = new THREE.DirectionalLight(0xffffff, 1.2); l.position.set(3,5,4); cena.add(l);
  const cam = new THREE.PerspectiveCamera(30, 1, .01, 100);
  loader.load('modelos/' + arq + '.glb', g => {
    const o = g.scene; cena.add(o); const b = new THREE.Box3().setFromObject(o); const c = b.getCenter(new THREE.Vector3()); const s = b.getSize(new THREE.Vector3()).length();
    cam.position.set(c.x + s * 1.05, c.y + s * .55, c.z + s * 1.05); cam.lookAt(c);
    const w = d.clientWidth, h = d.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); r.render(cena, cam); window.__prontos++;
  });
}
</script></body></html>
